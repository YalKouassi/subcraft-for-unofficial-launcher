# Unofficial bridge: mirrors Aalzard/subcraft releases for Craft Unofficial Launcher.
# Run by https://github.com/YalKouassi/craft-bridge (its README explains every key).

[bridge]
upstream = "Aalzard/subcraft"
repo = "YalKouassi/subcraft-for-unofficial-launcher"
upstream_sums = ["SHA256SUMS.txt"]
# Not mirrored: the Inno Setup installer (the launcher installs the portable zip) and the optional
# extra-environments pack.
skip = ['-setup\.exe$', '^SubCraft-extra-environments\.zip$']

[descriptor]
id = "subcraft"
name = "SubCraft"
tagline = "Paint PBR textures directly on 3D models"
publisher = "Aalzard"
bundle_id = "io.github.aalzard.subcraft"   # upstream has no reverse-DNS id; a GitHub-style one is used
website = "https://github.com/Aalzard/subcraft"
web_demo = "https://playground.daijro.dev/head/subcraft/"   # playground.daijro.dev's build of upstream's latest commit
color = "#fd6e02"

[icon]
url = "https://raw.githubusercontent.com/{upstream}/{tag}/packaging/linux/subcraft.png"

# The zip holds SubCraft-<v>-windows-x64\SubCraft.exe written with `\` separators, which the
# launcher refuses as unsafe, so it is repacked (repack = "auto"): same files and bytes, `/`
# separators, SubCraft.exe at the root (the launcher matches subcraft.exe case-insensitively).
[[rename]]
match = 'SubCraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-windows-x64\.zip'
to = '{id}-{version}-windows-x64-portable.zip'

# The tarball holds SubCraft-<v>-linux-x86_64/subcraft, which the launcher accepts as is.
[[rename]]
match = 'SubCraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-linux-x86_64\.tar\.gz'
to = '{id}-{version}-linux-x86_64.tar.gz'
